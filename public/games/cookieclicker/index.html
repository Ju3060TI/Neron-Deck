<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookie Clicker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    user-select: none;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; color: #f0c040; }
  #counter { font-size: 2rem; font-weight: 700; margin-bottom: 12px; }
  #cps { font-size: 0.9rem; color: #888; margin-bottom: 16px; }
  #cookie {
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d4a043, #b8782a 60%, #8b5a1b);
    border: 4px solid #a0702a;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    transition: transform 0.08s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #cookie:hover { filter: brightness(1.08); }
  #cookie:active { transform: scale(0.94); }
  #clickVal { font-size: 0.85rem; color: #aaa; margin-top: 8px; }
  .shop { margin-top: 24px; width: 100%; max-width: 420px; }
  .shop h2 { font-size: 1rem; margin-bottom: 10px; color: #ccc; }
  .shop-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .shop-item:hover:not(.disabled) { background: #1a2744; }
  .shop-item.disabled { opacity: 0.4; cursor: not-allowed; }
  .shop-item .name { font-size: 0.9rem; font-weight: 600; }
  .shop-item .desc { font-size: 0.75rem; color: #888; }
  .shop-item .price { font-size: 0.85rem; color: #f0c040; font-weight: 600; }
  .shop-item .owned { font-size: 0.75rem; color: #6cf; margin-left: 8px; }
  #floats { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .float {
    position: absolute;
    font-size: 1.2rem;
    font-weight: 700;
    color: #f0c040;
    animation: floatUp 1s ease-out forwards;
    pointer-events: none;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }
</style>
</head>
<body>
  <h1>Cookie Clicker</h1>
  <div id="counter">0 cookies</div>
  <div id="cps">0.0 per second</div>
  <div id="cookie">&#127850;</div>
  <div id="clickVal">+1 per click</div>
  <div class="shop">
    <h2>Shop</h2>
    <div id="shopItems"></div>
  </div>
  <div id="floats"></div>

<script>
(function() {
  let cookies = 0;
  let clickPower = 1;
  let cps = 0;

  const buildings = [
    { id: 'cursor', name: 'Cursor', desc: 'Auto-clicks once per second', price: 15, cps: 0.1, owned: 0 },
    { id: 'grandma', name: 'Grandma', desc: 'Bakes cookies', price: 100, cps: 1, owned: 0 },
    { id: 'farm', name: 'Farm', desc: 'Grows cookie plants', price: 1100, cps: 8, owned: 0 },
    { id: 'mine', name: 'Mine', desc: 'Digs for chocolate', price: 12000, cps: 47, owned: 0 },
    { id: 'factory', name: 'Factory', desc: 'Mass production', price: 130000, cps: 260, owned: 0 },
  ];

  const counterEl = document.getElementById('counter');
  const cpsEl = document.getElementById('cps');
  const clickValEl = document.getElementById('clickVal');
  const cookieEl = document.getElementById('cookie');
  const shopEl = document.getElementById('shopItems');
  const floatsEl = document.getElementById('floats');

  function getBuildingPrice(b) {
    return Math.ceil(b.price * Math.pow(1.15, b.owned));
  }

  function formatNum(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 10000) return (n / 1000).toFixed(1) + 'K';
    return Math.floor(n).toString();
  }

  function renderShop() {
    shopEl.innerHTML = '';
    buildings.forEach(function(b) {
      var price = getBuildingPrice(b);
      var canAfford = cookies >= price;
      var div = document.createElement('div');
      div.className = 'shop-item' + (canAfford ? '' : ' disabled');
      div.innerHTML =
        '<div><div class="name">' + b.name +
        '<span class="owned">x' + b.owned + '</span></div>' +
        '<div class="desc">' + b.desc + ' (+' + b.cps + ' CPS)</div></div>' +
        '<div class="price">' + formatNum(price) + ' cookies</div>';
      div.onclick = function() { buyBuilding(b); };
      shopEl.appendChild(div);
    });
  }

  function buyBuilding(b) {
    var price = getBuildingPrice(b);
    if (cookies < price) return;
    cookies -= price;
    b.owned++;
    recalcCps();
    updateUI();
    renderShop();
  }

  function recalcCps() {
    cps = 0;
    buildings.forEach(function(b) { cps += b.cps * b.owned; });
  }

  function updateUI() {
    counterEl.textContent = formatNum(cookies) + ' cookies';
    cpsEl.textContent = cps.toFixed(1) + ' per second';
    clickValEl.textContent = '+' + clickPower + ' per click';
  }

  cookieEl.addEventListener('click', function(e) {
    cookies += clickPower;
    updateUI();
    renderShop();
    var rect = cookieEl.getBoundingClientRect();
    var f = document.createElement('div');
    f.className = 'float';
    f.textContent = '+' + clickPower;
    f.style.left = (e.clientX - 10) + 'px';
    f.style.top = (e.clientY - 20) + 'px';
    floatsEl.appendChild(f);
    setTimeout(function() { f.remove(); }, 1000);
  });

  setInterval(function() {
    cookies += cps / 10;
    updateUI();
  }, 100);

  setInterval(function() { renderShop(); }, 500);

  updateUI();
  renderShop();
})();
</script>
</body>
</html>
